----------------------

dotenv :  npm install dotenv
import dotenv from "dotenv"

faker library: npm install @faker-js/faker
import {faker} from "@faker-js/faker"

Faker is a test-data generation library used to create realistic, dynamic data instead of hard-coding
test values
faker comes from the @faker-js/faker npm package(external)

ex:
faker.person.firstName()
faker.person.lastName()
faker.company.name()
faker.company.buzzNoun()
