Commands for Allure Reports:
---------------------------

Allure Report is a test reporting framework used to generate interactive and detailed 
HTML reports for automation test execution.

Step:1

Add below commands in the configuration file make below changes

reporter: [['html'], ['allure-playwright']],

Step:2

Run the plugin in the root directory and execute below commands in the terminal 

Install Reporter
1. npm i -D allure-playwright

Install Allure Commandline
2. npm i -g allure-commandline --save-dev

3. Execute any playwright test file : npx playwright test filename.spec.ts

4. Execute the command : allure serve


