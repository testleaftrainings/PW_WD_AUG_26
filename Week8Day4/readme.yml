Folder structure:
-----------------

data-> hold all the data files
utility-> wrapper methods under helpers folder ex: api, ui, fixtures
page -> classes
test->for execurting the test cases
reports-> to have timestamp and html report

Dependencies/libraries:
-----------------------

PW installation/configuration 
npm init playwright@latest

node version
npm -v

typescript config file
tsconfig.json -> tsc --init

Data parameterization:
----------------------

csv-> npm install csv-parser
env->npm install dotenv
axios-> npm insall axios
faker-> npm install @faker-js/faker
excel-> npm install xlsx
path-> npm install path
fs-> npm install fs


steps to run the framework:
---------------------------

1) Import the framework

2) install node modules by running command "npm install" from root directory.

